<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Hidden articles · Hanisha Pulimaddi</title>
  <script>
    // Apply a saved theme before first paint to avoid a flash. With no saved
    // choice, no attribute is set and the CSS follows the system setting.
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="top">

  <header class="site-header">
    <div class="container nav">
      <a class="nav__name" href="index.html">Hanisha Pulimaddi</a>

      <nav class="nav__links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="index.html#essays">Essays</a>
        <a href="index.html#about">About me</a>
      </nav>

      <div class="nav__right">
        <button type="button" class="toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
          <svg class="toggle__icon toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="toggle__icon toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
          <span class="toggle__knob" aria-hidden="true"></span>
        </button>
        <a class="btn btn--primary" href="index.html#contact">Contact <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- 1. Locked: the passphrase that opens the list of titles -->
      <section class="gate" id="gate-view" aria-labelledby="gate-title">
        <h1 class="gate__title" id="gate-title">Hidden articles</h1>
        <p class="gate__lead">Some writing I keep out of the open. If you have the code, it's yours to read.</p>
        <form class="panel gate__form" id="gate-form" novalidate>
          <div class="field">
            <label class="field__label" for="gate-pass">Access code</label>
            <input class="field__input" id="gate-pass" type="password" autocomplete="off" placeholder="Enter the code" required />
          </div>
          <div class="form__actions">
            <button class="btn btn--primary btn--lg" type="submit" id="gate-submit">Unlock <span aria-hidden="true">→</span></button>
          </div>
          <p class="form__status" id="gate-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- 2. Unlocked: the titles, each still locked on its own -->
      <section class="section hidden-list-view" id="list-view" aria-labelledby="list-title" hidden>
        <div class="section-head">
          <h2 class="section-label" id="list-title">Hidden articles</h2>
          <button class="view-all" type="button" id="lock-again">Lock again</button>
        </div>
        <div class="grid" id="hidden-list"></div>
      </section>

      <!-- 3. One article: locked until its own code is entered -->
      <article class="essay" id="article-view" aria-labelledby="article-title" hidden>
        <button class="essay__back" type="button" id="article-back"><span aria-hidden="true">←</span> All hidden articles</button>
        <header class="essay__head">
          <span class="card__category">Hidden</span>
          <h1 class="essay__title" id="article-title"></h1>
          <p class="essay__subtitle" id="article-subtitle" hidden></p>
          <div class="byline">
            <span class="avatar avatar--lg" aria-hidden="true"><img src="Images/ProfilePicture.jpeg" width="608" height="1000" alt="" /></span>
            <div>
              <a class="byline__name" href="index.html#about">Hanisha Pulimaddi</a>
              <p class="byline__meta"><time id="article-date"></time></p>
            </div>
          </div>
        </header>
        <hr class="rule" />

        <form class="panel gate__form gate__form--inline" id="article-form" novalidate>
          <div class="field">
            <label class="field__label" for="article-pass">Code for this article</label>
            <input class="field__input" id="article-pass" type="password" autocomplete="off" placeholder="Enter the code" required />
          </div>
          <div class="form__actions">
            <button class="btn btn--primary btn--lg" type="submit" id="article-submit">Open <span aria-hidden="true">→</span></button>
          </div>
          <p class="form__status" id="article-status" role="status" aria-live="polite"></p>
        </form>

        <div class="essay__body" id="article-body" hidden></div>
        <div class="essay__foot">
          <button class="btn" type="button" id="article-back-foot"><span aria-hidden="true">←</span> Back to hidden articles</button>
        </div>
      </article>

    </div>
  </main>

  <footer class="container">
    <div class="footer">
      <p>© 2026 Hanisha Pulimaddi</p>
      <a href="index.html">Back to the site</a>
    </div>
  </footer>

  <script src="main.js"></script>
  <script src="hidden.js"></script>
</body>
</html>
